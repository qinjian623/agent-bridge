name: Test, package and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_VERSION: "0.13.7"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run ruff check src tests scripts skills/cli-agent-bridge/scripts
      - run: python scripts/check_public_content.py
      - run: node --version
      - run: uv run python -m unittest discover -s tests -v

  package:
    name: Package / ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Check stable release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) or tag != f"v{version}":
              raise SystemExit("Release tag must be stable vX.Y.Z and match pyproject.toml")
          PY
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Check clean installation
        env:
          SMOKE_ENV: ${{ runner.temp }}/bridge-package-smoke
          SMOKE_STATE: ${{ runner.temp }}/bridge-package-state
        run: |
          uv venv "$SMOKE_ENV" --python 3.11
          uv pip install --python "$SMOKE_ENV/bin/python" dist/*.whl
          "$SMOKE_ENV/bin/agent-bridge" --help
          "$SMOKE_ENV/bin/agent-bridge" --lang zh-CN --help
          "$SMOKE_ENV/bin/agent-bridge" --state "$SMOKE_STATE" init \
            --non-interactive --profile name=smoke,runtime=codex,provider=openai-codex,model=gpt-5
          "$SMOKE_ENV/bin/agent-bridge" --state "$SMOKE_STATE" init --non-interactive
          "$SMOKE_ENV/bin/agent-bridge" --state "$SMOKE_STATE" doctor
          "$SMOKE_ENV/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from agent_bridge.config import Config
          config = Config.load(Path(os.environ["SMOKE_STATE"]) / "config.json")
          assert config.profiles and not any(p.verified for p in config.profiles.values())
          PY
          "$SMOKE_ENV/bin/python" -I scripts/check_installed_package.py
      - name: Write SHA256SUMS and latest.json
        run: |
          cp install.sh dist/install.sh
          "$SMOKE_ENV/bin/python" - <<'PY'
          import hashlib, json, tomllib
          from pathlib import Path
          from agent_bridge.updater import build_release_manifest
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          files = sorted([*wheels, *sdists, Path("dist/install.sh")])
          sums = Path("dist/SHA256SUMS")
          sums.write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files
          ))
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          manifest = build_release_manifest(f"v{version}", wheels[0].stat().st_size, sums.stat().st_size)
          Path("dist/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
        env:
          SMOKE_ENV: ${{ runner.temp }}/bridge-package-smoke
      - name: Check the release installer
        run: python scripts/check_bootstrap_install.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-agent-bridge-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
            dist/latest.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish stable release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-agent-bridge-ubuntu-latest
          path: dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" *.whl *.tar.gz install.sh SHA256SUMS latest.json \
            --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
